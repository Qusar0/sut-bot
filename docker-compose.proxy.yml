# Прокси для sut.ru через Xray, когда прямой IP сервера заблокирован вузом.
# Включается на сервере добавлением в .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.proxy.yml
#   SUT_PROXY=socks5h://proxy:1080
# Конфиг Xray кладётся в ./xray/config.json (делается scripts/make_xray_proxy.py из экспорта
# «Копировать JSON» в Happ; в git не коммитится — там секрет VPN). Локально не подключается.
services:
  proxy:
    image: teddysun/xray:26.10.10
    restart: unless-stopped
    volumes:
      - ./xray/config.json:/etc/xray/config.json:ro
    mem_limit: 90m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  bot:
    environment:
      SUT_PROXY: ${SUT_PROXY:-socks5h://proxy:1080}
    depends_on:
      proxy:
        condition: service_started
