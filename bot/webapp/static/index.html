<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расписание СПбГУТ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  /* тёмная тема (фиксированная, как в референсе) */
  --bg:#0e1116;--sec:#1a2029;--card:#1a2029;--text:#eef2f6;--hint:#8b94a3;--link:#ff8a2a;
  --brand:#ff8a2a;--brand2:#ff6a2b;
  --lecture:#4c8dff;--practice:#2fc183;--lab:#ff5b5b;--other:#8b93a0;
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:74px}
.wrap{padding:0 18px}
.divider{height:1px;background:rgba(255,255,255,.07);margin:12px 0}
h1{margin:0;font-size:20px;font-weight:700}
.sub{color:var(--hint);font-size:13px}
.hint{color:var(--hint)}

/* шапка обычных экранов */
header{position:sticky;top:0;background:var(--bg);padding:18px 18px 10px;z-index:5}

/* hero (главная) */
.hero{background:linear-gradient(135deg,var(--brand) 0%,var(--brand2) 100%);color:#fff;padding:18px 16px 20px;border-radius:0 0 24px 24px}
.hero .top{display:flex;justify-content:space-between;align-items:flex-start}
.hero .greet{font-size:22px;font-weight:700}
.hero .meta{opacity:.9;font-size:13px}
.hero .ava{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:20px}
.search{margin-top:14px;background:rgba(255,255,255,.22);border-radius:14px;padding:11px 14px;color:#fff;font-size:14px;display:flex;gap:8px;align-items:center;cursor:pointer}
.search::placeholder{color:rgba(255,255,255,.8)}
.nowcard{margin-top:14px;background:rgba(0,0,0,.18);border-radius:16px;padding:14px}
.nowcard .bdg{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600}
.nowcard .pill{background:rgba(255,255,255,.22);padding:3px 10px;border-radius:9px}
.nowcard .subj{font-size:18px;font-weight:700;margin:6px 0 10px}
.prog{height:6px;background:rgba(255,255,255,.28);border-radius:3px;position:relative;margin:10px 0}
.prog>i{position:absolute;left:0;top:0;bottom:0;background:#fff;border-radius:3px}
.prog>b{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;background:#fff;transform:translateX(-50%)}
.nowcard .ends{display:flex;justify-content:space-between;font-size:12px;opacity:.9;margin-top:2px}
.nowcard .info{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.nowcard .chip{background:rgba(255,255,255,.18);border-radius:10px;padding:7px 11px;font-size:13px}

/* секции и плитки */
.block{margin:18px 0 6px;font-weight:700;font-size:16px}
.big{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:var(--radius);padding:16px;margin:10px 0;cursor:pointer}
.big .ic{width:44px;height:44px;border-radius:12px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{background:var(--card);border-radius:14px;padding:14px 6px;text-align:center;cursor:pointer}
.tile .ti{font-size:22px}
.tile .tt{font-size:12px;color:var(--hint);margin-top:5px}

/* полоска дней */
.strip{display:flex;gap:7px;overflow-x:auto;padding:8px 16px 4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip .d{flex:0 0 auto;width:46px;text-align:center;padding:7px 0;border-radius:13px;background:var(--sec);cursor:pointer}
.strip .d.active{background:var(--brand);color:#fff}
.strip .d small{display:block;font-size:11px;opacity:.75}
.strip .d b{font-size:17px}
.strip .d .bars{display:flex;gap:2px;justify-content:center;margin-top:4px;height:4px}
.strip .d .bars .bar{width:10px;height:4px;border-radius:2px}
.bar.lecture{background:var(--lecture)}.bar.practice{background:var(--practice)}.bar.lab{background:var(--lab)}.bar.other{background:var(--other)}.bar.none{background:transparent}
.strip .d.active .bars .bar{background:rgba(255,255,255,.9)}

/* таймлайн дня */
.tl{display:flex;gap:12px;margin:16px 0}
.tlleft{flex:0 0 50px;text-align:center;position:relative}
.tlleft::before{content:"";position:absolute;left:50%;top:36px;bottom:-16px;width:2px;background:var(--sec);transform:translateX(-50%)}
.tl:last-child .tlleft::before{display:none}
.circle{width:36px;height:36px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;background:var(--other)}
.tl.lecture .circle{background:var(--lecture)}.tl.practice .circle{background:var(--practice)}.tl.lab .circle{background:var(--lab)}
.tltime{font-size:12px;color:var(--hint);margin-top:5px;font-variant-numeric:tabular-nums}
.tltime span{opacity:.7}
.tlcard{flex:1;background:var(--card);border-radius:var(--radius);padding:12px 14px}
.tl.active .tlcard{box-shadow:0 0 0 2px var(--practice)}
.tlhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.count{font-size:12px;color:var(--hint);font-variant-numeric:tabular-nums}
.lrow{font-size:13px;color:var(--hint);margin-top:3px}
.foot{font-size:12px;margin-top:7px;font-weight:600}
.foot.soon{color:var(--brand)}.foot.now{color:var(--practice)}
.tag{font-size:11px;font-weight:700;text-transform:uppercase}
.tag.lecture{color:var(--lecture)}.tag.practice{color:var(--practice)}.tag.lab{color:var(--lab)}

/* простые карточки/строки */
.card{background:var(--card);border-radius:var(--radius);padding:12px 14px;margin:10px 0;border-left:4px solid var(--other)}
.card.lecture{border-color:var(--lecture)}.card.practice{border-color:var(--practice)}.card.lab{border-color:var(--lab)}
.card .time{font-size:13px;color:var(--hint)}
.subj{font-weight:600;margin:2px 0}
.meta{font-size:13px;color:var(--hint)}
.daytitle{font-weight:700;margin:18px 0 6px}
.empty{color:var(--hint);padding:40px 0;text-align:center}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 14px;background:var(--card);border-radius:14px;margin:9px 0;cursor:pointer}
.rowprog{font-size:13px;color:var(--hint);white-space:nowrap}
.pbar{height:6px;background:rgba(128,128,128,.18);border-radius:3px;margin-top:7px;overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--brand)}
input,select{width:100%;padding:12px 13px;border-radius:13px;border:none;background:var(--card);color:var(--text);font-size:15px;outline:none}
.seg{display:flex;gap:8px;margin:12px 0}
.seg button{flex:1;padding:11px;border:none;border-radius:12px;background:var(--card);color:var(--text);font-size:14px;font-weight:600;cursor:pointer}
.seg button.primary{background:var(--brand);color:#fff}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--sec)}
.sw{width:48px;height:28px;border-radius:14px;background:rgba(128,128,128,.4);position:relative;transition:.2s;flex:0 0 auto;cursor:pointer}
.sw.on{background:var(--brand)}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on i{left:23px}
.pill2{display:inline-block;font-size:12px;background:var(--sec);border-radius:10px;padding:4px 10px;margin:2px 5px 2px 0}
.note{font-size:12px;color:var(--hint);margin:8px 0}
.avatar{width:76px;height:76px;border-radius:50%;object-fit:cover;float:right;margin-left:12px}
a{color:var(--link)}
button.mk{background:var(--brand);color:#fff;border:none;border-radius:10px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer}
.spin{text-align:center;color:var(--hint);padding:50px 0}

nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--bg);border-top:1px solid var(--sec);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:none;background:none;color:var(--hint);padding:9px 0;font-size:11px;cursor:pointer}
nav button.on{color:var(--brand)}
nav button .ic{font-size:21px;display:block;margin-bottom:1px}
</style>
</head>
<body>
<div id="top"></div>
<header id="hdr" style="display:none"><h1 id="h-title">Расписание</h1><div class="sub" id="h-sub"></div></header>
<div id="strip"></div>
<main class="wrap" id="view"><div class="spin">Загрузка…</div></main>
<nav>
  <button data-tab="home" class="on"><span class="ic">🏠</span>Главная</button>
  <button data-tab="day"><span class="ic">📅</span>Расписание</button>
  <button data-tab="subjects"><span class="ic">📚</span>Предметы</button>
  <button data-tab="search"><span class="ic">🔎</span>Поиск</button>
  <button data-tab="settings"><span class="ic">⚙️</span>Ещё</button>
</nav>
<script src="static/app.js"></script>
</body>
</html>
