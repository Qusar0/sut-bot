<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расписание СПбГУТ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#fff);
  --sec:var(--tg-theme-secondary-bg-color,#f1f3f6);
  --text:var(--tg-theme-text-color,#18202a);
  --hint:var(--tg-theme-hint-color,#8a93a0);
  --link:var(--tg-theme-link-color,#2f6feb);
  --btn:var(--tg-theme-button-color,#2f6feb);
  --btn-text:var(--tg-theme-button-text-color,#fff);
  --lecture:#2f6feb;--practice:#1f9d55;--lab:#e5484d;--other:#787e8a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:64px}
header{position:sticky;top:0;background:var(--bg);padding:14px 16px 8px;z-index:5}
header h1{margin:0;font-size:19px}
header .sub{color:var(--hint);font-size:13px}
.wrap{padding:0 16px}
.strip{display:flex;gap:6px;overflow-x:auto;padding:8px 16px 4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip .d{flex:0 0 auto;width:44px;text-align:center;padding:6px 0;border-radius:12px;background:var(--sec);cursor:pointer}
.strip .d.active{background:var(--btn);color:var(--btn-text)}
.strip .d small{display:block;font-size:11px;opacity:.7}
.strip .d b{font-size:17px}
.strip .d .bars{display:flex;gap:2px;justify-content:center;margin-top:4px;height:4px}
.strip .d .bars .bar{width:10px;height:4px;border-radius:2px}
.bar.lecture{background:var(--lecture)}.bar.practice{background:var(--practice)}.bar.lab{background:var(--lab)}.bar.other{background:var(--other)}.bar.none{background:transparent}
.strip .d.active .bars .bar{background:rgba(255,255,255,.85)}
/* таймлайн дня */
.tl{display:flex;gap:10px;margin:10px 0}
.tlleft{flex:0 0 52px;text-align:center;position:relative}
.tlleft::before{content:"";position:absolute;left:50%;top:34px;bottom:-14px;width:2px;background:var(--sec);transform:translateX(-50%)}
.tl:last-child .tlleft::before{display:none}
.circle{width:34px;height:34px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;background:var(--other)}
.tl.lecture .circle{background:var(--lecture)}.tl.practice .circle{background:var(--practice)}.tl.lab .circle{background:var(--lab)}
.tltime{font-size:12px;color:var(--hint);margin-top:4px;font-variant-numeric:tabular-nums}
.tltime span{color:var(--hint);opacity:.7}
.tlcard{flex:1;background:var(--sec);border-radius:14px;padding:11px 13px}
.tl.active .tlcard{box-shadow:0 0 0 2px var(--practice)}
.tlhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.count{font-size:12px;color:var(--hint);font-variant-numeric:tabular-nums}
.lrow{font-size:13px;color:var(--hint);margin-top:3px}
.foot{font-size:12px;margin-top:6px;font-weight:600}
.foot.soon{color:var(--lab)}.foot.now{color:var(--practice)}
.card{background:var(--sec);border-radius:14px;padding:12px 14px;margin:10px 0;border-left:4px solid var(--other)}
.card.lecture{border-color:var(--lecture)}.card.practice{border-color:var(--practice)}.card.lab{border-color:var(--lab)}
.card .time{font-size:13px;color:var(--hint);font-variant-numeric:tabular-nums}
.card .subj{font-weight:600;margin:2px 0}
.card .meta{font-size:13px;color:var(--hint)}
.tag{font-size:11px;font-weight:600;text-transform:uppercase}
.tag.lecture{color:var(--lecture)}.tag.practice{color:var(--practice)}.tag.lab{color:var(--lab)}
.daytitle{font-weight:600;margin:16px 0 4px}
.empty{color:var(--hint);padding:30px 0;text-align:center}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--sec);border-radius:12px;margin:8px 0;cursor:pointer}
.row .prog{font-size:13px;color:var(--hint)}
.bar{height:6px;background:rgba(128,128,128,.2);border-radius:3px;margin-top:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--practice)}
input,select{width:100%;padding:11px 12px;border-radius:12px;border:none;background:var(--sec);color:var(--text);font-size:15px}
.seg{display:flex;gap:8px;margin:12px 0}
.seg button{flex:1;padding:8px;border:none;border-radius:10px;background:var(--sec);color:var(--text);font-size:13px}
.seg button.on{background:var(--btn);color:var(--btn-text)}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--sec)}
.sw{width:46px;height:28px;border-radius:14px;background:rgba(128,128,128,.35);position:relative;transition:.2s;flex:0 0 auto}
.sw.on{background:var(--practice)}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on i{left:21px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--bg);border-top:1px solid var(--sec);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:none;background:none;color:var(--hint);padding:9px 0;font-size:11px}
nav button.on{color:var(--link)}
nav button .ic{font-size:20px;display:block}
.pill{display:inline-block;font-size:12px;background:var(--sec);border-radius:10px;padding:3px 9px;margin:2px 4px 2px 0}
.note{font-size:12px;color:var(--hint);margin:8px 0}
a{color:var(--link)}
.avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;float:right;margin-left:12px}
.spin{text-align:center;color:var(--hint);padding:40px 0}
</style>
</head>
<body>
<header><h1 id="h-title">Расписание</h1><div class="sub" id="h-sub"></div></header>
<div id="strip"></div>
<main class="wrap" id="view"><div class="spin">Загрузка…</div></main>
<nav>
  <button data-tab="day" class="on"><span class="ic">📅</span>День</button>
  <button data-tab="week"><span class="ic">🗓</span>Неделя</button>
  <button data-tab="subjects"><span class="ic">📚</span>Предметы</button>
  <button data-tab="search"><span class="ic">🔎</span>Поиск</button>
  <button data-tab="settings"><span class="ic">⚙️</span>Ещё</button>
</nav>
<script src="static/app.js"></script>
</body>
</html>
