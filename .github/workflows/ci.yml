name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Линтер
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Тесты (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: "0:ci-dummy-token"
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - run: pip install -r requirements-dev.txt
      - run: pytest -q -rf

  test-postgres:
    name: Тесты на PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sutbot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BOT_TOKEN: "0:ci-dummy-token"
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/sutbot
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - run: pip install -r requirements-dev.txt
      - run: pytest -q -rf

  docker:
    name: Сборка и публикация Docker-образа
    runs-on: ubuntu-latest
    # на PR только собираем для проверки, на push в main — пушим образ в GHCR
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Логин в GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Метаданные образа
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Выкладка на сервер
    needs: [lint, test, test-postgres, docker]
    # включается переменной репозитория DEPLOY_ENABLED=true (Settings → Secrets and variables → Actions → Variables)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-production
    steps:
      - name: Обновить и перезапустить бота по SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ${{ vars.DEPLOY_PATH || '/opt/sut-bot' }}
            git fetch --quiet origin main
            git reset --hard origin/main
            # образ собран в CI и лежит в GHCR — на сервере только подтягиваем, не билдим
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f > /dev/null
            sleep 15
            curl -fsS http://127.0.0.1:8080/health
